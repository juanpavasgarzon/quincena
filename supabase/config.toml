# Ref: plantilla oficial del CLI — https://github.com/supabase/cli/blob/develop/pkg/config/templates/config.toml
# Guías: https://supabase.com/docs/guides/auth/password-security
#        https://supabase.com/docs/guides/auth/redirect-urls
#
# Tras cambiar Auth aquí:
#   supabase stop && supabase start           (local)
#   supabase config push                      (hosted, con proyecto linkeado)
#
project_id = "quincena"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[api.tls]
enabled = false

[db]
port = 54322
shadow_port = 54320
health_timeout = "2m"
major_version = 17

[db.pooler]
enabled = false
port = 54329
pool_mode = "transaction"
default_pool_size = 20
max_client_conn = 100

[db.migrations]
enabled = true
schema_paths = []

[db.seed]
enabled = true
sql_paths = ["./seed.sql"]

[db.network_restrictions]
enabled = false
allowed_cidrs = ["0.0.0.0/0"]
allowed_cidrs_v6 = ["::/0"]

[realtime]
enabled = true

[studio]
enabled = true
port = 54323
api_url = "http://127.0.0.1"
openai_api_key = "env(OPENAI_API_KEY)"

[inbucket]
enabled = true
port = 54324

[storage]
enabled = true
file_size_limit = "50MiB"

[storage.s3_protocol]
enabled = true

[storage.analytics]
enabled = false
max_namespaces = 5
max_tables = 10
max_catalogs = 2

[storage.vector]
enabled = false
max_buckets = 10
max_indexes = 5

# --- Auth / Quincena (Expo native + Expo Go)
[auth]
enabled = true
# Deep link fallback; debe estar en additional_redirect_urls
site_url = "quincena://callback"
# external_url omitido aquí → en local/stack usa la API externa por defecto; en push el host remoto corrige JWT issuer automáticamente.
additional_redirect_urls = [
  "quincena://callback",
  "quincena://**",
  "exp://**",
  "exps://**",
]

jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10

enable_signup = true
enable_anonymous_sign_ins = false
enable_manual_linking = false

# Recomendado por Supabase: ≥8 caracteres y reglas fuertes
# https://supabase.com/docs/guides/auth/password-security
minimum_password_length = 8
password_requirements = "lower_upper_letters_digits_symbols"

[auth.rate_limit]
# Hosted aplica estos topes incluso si no hay SMTP propio — no uses valores absurdamente altos.
email_sent = 60
sms_sent = 30
anonymous_users = 30
token_refresh = 150
sign_in_sign_ups = 30
token_verifications = 30
web3 = 30

[auth.email]
enable_signup = true
double_confirm_changes = true
# Activa emails de confirmación de registro (plantilla Confirm signup).
enable_confirmations = true
secure_password_change = false
# Mínimo tiempo entre mails de mismo tipo (OTP, magic link, reset). Evita 1s (abuso/fluido).
max_frequency = "1m0s"
# OTP en plantilla {{ .Token }} — 8 dígitos alinea con proyecto remoto habitual; usar 6 si prefieres UX más corto.
otp_length = 8
otp_expiry = 3600

[auth.sms]
enable_signup = false
enable_confirmations = false
template = "Your code is {{ .Code }}"
max_frequency = "5s"

[auth.sms.twilio]
enabled = false
account_sid = ""
message_service_sid = ""
auth_token = "env(SUPABASE_AUTH_SMS_TWILIO_AUTH_TOKEN)"

# TOTP MFA: restaura lo típico de producción si lo tenías habilitado (no equivale al plan billing).
[auth.mfa]
max_enrolled_factors = 10

[auth.mfa.totp]
enroll_enabled = true
verify_enabled = true

[auth.mfa.phone]
enroll_enabled = false
verify_enabled = false
otp_length = 6
template = "Your code is {{ .Code }}"
max_frequency = "5s"

[auth.external.apple]
enabled = false
client_id = ""
secret = "env(SUPABASE_AUTH_EXTERNAL_APPLE_SECRET)"
redirect_uri = ""
url = ""
skip_nonce_check = false
email_optional = false

[auth.web3.solana]
enabled = false

[auth.third_party.firebase]
enabled = false

[auth.third_party.auth0]
enabled = false

[auth.third_party.aws_cognito]
enabled = false

[auth.third_party.clerk]
enabled = false

[auth.oauth_server]
enabled = false
authorization_url_path = "/oauth/consent"
allow_dynamic_registration = false

[edge_runtime]
enabled = true
policy = "per_worker"
inspector_port = 8083
deno_version = 2

[analytics]
enabled = true
port = 54327
backend = "postgres"

[experimental]
orioledb_version = ""
s3_host = "env(S3_HOST)"
s3_region = "env(S3_REGION)"
s3_access_key = "env(S3_ACCESS_KEY)"
s3_secret_key = "env(S3_SECRET_KEY)"
